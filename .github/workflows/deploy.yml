# ═══════════════════════════════════════════════════════════════════════════
# TradeAI Frontend — GitHub Actions CI/CD Pipeline
# Builds frontend Docker image, pushes to GHCR, restarts frontend on AWS
# ═══════════════════════════════════════════════════════════════════════════

name: Deploy Frontend

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io

concurrency:
  group: deploy-frontend
  cancel-in-progress: false

jobs:
  build:
    name: Build & Push Frontend Image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image_name: ${{ steps.image.outputs.name }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set image name (lowercase)
        id: image
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/tradeaiui" >> $GITHUB_OUTPUT

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build & push frontend image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ${{ steps.image.outputs.name }}:latest
            ${{ steps.image.outputs.name }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy to Production
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        env:
          FRONTEND_IMAGE: ${{ needs.build.outputs.image_name }}
          IMAGE_TAG: ${{ github.sha }}
          GHCR_TOKEN: ${{ secrets.GHCR_TOKEN }}
        with:
          host: ${{ secrets.AWS_HOST }}
          username: ${{ secrets.AWS_USER }}
          key: ${{ secrets.AWS_SSH_KEY }}
          envs: FRONTEND_IMAGE,IMAGE_TAG,GHCR_TOKEN
          script: |
            set -e

            # Save deploy vars before loading .env
            DEPLOY_IMAGE="${FRONTEND_IMAGE}"
            DEPLOY_TAG="${IMAGE_TAG}"

            cd /opt/tradeai

            # Load env vars from .env
            set -a; eval $(sudo cat .env | grep -v '^#' | grep -v '^$'); set +a

            # Override with deploy vars
            export FRONTEND_IMAGE="${DEPLOY_IMAGE}"
            export FRONTEND_TAG="${DEPLOY_TAG}"

            # Log in to GHCR
            echo "${GHCR_TOKEN}" | sudo docker login ghcr.io -u ChikkaRaviKiran --password-stdin

            # Pull images directly (more reliable than compose pull)
            echo "Pulling ${FRONTEND_IMAGE}:${FRONTEND_TAG}"
            sudo docker pull "${FRONTEND_IMAGE}:${FRONTEND_TAG}" || {
              echo "SHA tag pull failed, trying latest..."
              sudo docker pull "${FRONTEND_IMAGE}:latest"
              sudo docker tag "${FRONTEND_IMAGE}:latest" "${FRONTEND_IMAGE}:${FRONTEND_TAG}"
            }

            # Restart frontend
            sudo -E docker compose -f docker-compose.prod.yml up -d frontend

            # Clean up old images
            sudo docker image prune -f
